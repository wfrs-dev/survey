name: Test

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
        # 1.21 is the minimum required by go.mod; "stable" follows the current
        # release instead of going stale like a pinned patch version would.
        go: ["1.21", "stable"]
        exclude:
          # Go older than 1.24 links Mach-O binaries without an LC_UUID load
          # command and the current macOS runner image aborts them on load:
          #   dyld: missing LC_UUID load command / signal: abort trap
          # (go.dev/doc/go1.24, golang/go#68678). The 1.21 compatibility leg
          # runs on Linux and Windows; macOS is covered by the stable leg.
          - platform: macos-latest
            go: "1.21"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "${{ matrix.go }}"
          cache: true

      - name: Add problem matcher
        run: echo "::add-matcher::$PWD/.github/matchers.json"

      - name: Run tests
        run: go test -timeout 120s ./...

  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "stable"
          cache: true

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Compile examples and manual test programs
        run: |
          set -euo pipefail
          # These are //go:build ignore main programs, so neither `go vet ./...`
          # nor `go test ./...` looks at them: without this step they can rot
          # silently, including their import paths.
          for file in examples/*.go tests/*.go; do
            go build -o /dev/null "$file"
          done

      - name: Test with the race detector
        run: go test -race -timeout 180s ./...
