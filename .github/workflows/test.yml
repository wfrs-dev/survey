name: Test

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest]
        # 1.21 is the minimum required by go.mod; "stable" follows the current
        # release instead of going stale like a pinned patch version would.
        go: ["1.21", "stable"]
        # macOS is intentionally out of the matrix for now. Two separate
        # problems, both about the runner rather than about this code:
        #
        #   1. Go older than 1.24 links Mach-O binaries without an LC_UUID load
        #      command, and the current macOS runner image aborts them on load
        #      ("dyld: missing LC_UUID load command" / "signal: abort trap").
        #      macOS therefore cannot carry the older-Go leg at all;
        #      see go.dev/doc/go1.24 and golang/go#68678.
        #   2. The macOS jobs on this repository are frequently cancelled after
        #      roughly fifteen minutes without ever starting, for lack of runner
        #      capacity. A cancelled job is reported as a failing check, which
        #      makes a green commit look broken.
        #
        # Put macos-latest back into `platform` once a real macOS runner is
        # reliably available, and drop this comment then.
        #
        # In the meantime, verify on a Mac by hand:
        #
        #   go test -count=1 ./...
        #   go test -race -count=1 ./...
        #   go vet ./... && test -z "$(gofmt -l .)"
        #   for f in examples/*.go tests/*.go; do go build -o /dev/null "$f"; done
        #
        # Those example and manual-test programs are //go:build ignore mains, so
        # neither `go vet ./...` nor `go test ./...` looks at them. To check the
        # other Go version, let the toolchain fetch it, for example:
        #
        #   GOTOOLCHAIN=go1.23.12 go test -count=1 ./...

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "${{ matrix.go }}"
          cache: true

      - name: Add problem matcher
        run: echo "::add-matcher::$PWD/.github/matchers.json"

      - name: Run tests
        run: go test -timeout 120s ./...

  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "stable"
          cache: true

      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Compile examples and manual test programs
        run: |
          set -euo pipefail
          # These are //go:build ignore main programs, so neither `go vet ./...`
          # nor `go test ./...` looks at them: without this step they can rot
          # silently, including their import paths.
          for file in examples/*.go tests/*.go; do
            go build -o /dev/null "$file"
          done

      - name: Test with the race detector
        run: go test -race -timeout 180s ./...
